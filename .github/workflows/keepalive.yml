# Keeps the free Supabase project from pausing (it pauses after ~7 days without activity).
#
# Setup (private repo, e.g. bigone-keepalive):
#   1. Put this file at .github/workflows/keepalive.yml in that repo.
#   2. Repo > Settings > Secrets and variables > Actions > New repository secret:
#        SUPABASE_URL = https://ajtkpcsogaaihsfulvih.supabase.co
#        SUPABASE_KEY = the publishable key (sb_publishable_...)
#   3. Actions tab > "Keep Supabase awake" > Run workflow, once, to check it goes green.
# If a run fails, GitHub emails the repo owner.

name: Keep Supabase awake

on:
  schedule:
    - cron: "17 3 */3 * *"   # every 3 days at 03:17 UTC (11:17 PH time)
  workflow_dispatch:          # "Run workflow" button for manual checks

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          curl --fail-with-body -sS -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}'
